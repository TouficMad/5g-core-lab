# mMTC - massive IoT: SMF
fullnameOverride: smf-mmtc
config:
  pcrf:
    enabled: false
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
customOpen5gsConfig:
  logger:
    level: info
  smf:
    sbi:
      server:
      - dev: eth0
        port: 7777
      client:
        scp:
        - uri: http://open5gs-scp-sbi:7777
    pfcp:
      server:
      - dev: eth0
      client:
        upf:
        - address: upf-mmtc-pfcp
    gtpc:
      server:
      - dev: eth0
    gtpu:
      server:
      - dev: eth0
    metrics:
      server:
      - dev: eth0
        port: 9090
    session:
    - subnet: 10.47.0.0/16
      gateway: 10.47.0.1
      dnn: internet
    dns:
    - 8.8.8.8
    - 8.8.4.4
    mtu: 1400
    info:
    - s_nssai:
      - sst: 3
        sd: '000003'
        dnn:
        - internet

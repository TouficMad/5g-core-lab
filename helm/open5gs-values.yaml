# Open5GS 5G SA core (Gradiant chart). PLMN 001/01 = test network.
hss: { enabled: false }
mme: { enabled: false }
pcrf: { enabled: false }
sgwc: { enabled: false }
sgwu: { enabled: false }
nodeSelector: { lab/role: core }

# Expose Prometheus metrics from AMF / SMF / UPF / PCF
amf:
  metrics: { enabled: true, serviceMonitor: { enabled: true } }
smf:
  config:
    pcrf: { enabled: false }
  metrics: { enabled: true, serviceMonitor: { enabled: true } }
upf:
  metrics: { enabled: true, serviceMonitor: { enabled: true } }
pcf:
  metrics: { enabled: true, serviceMonitor: { enabled: true } }

# Seed subscribers in MongoDB (IMSIs match helm/ueransim-values.yaml)
populate:
  enabled: true
  initCommands:
    - open5gs-dbctl add_ue_with_apn 001010000000001 465B5CE8B199B49FAA5F0A2EE238A6BC E8ED289DEBA952E4283B54E88E6183CA internet
    - open5gs-dbctl type 001010000000001 1
